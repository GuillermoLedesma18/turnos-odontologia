name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: turnos
          POSTGRES_PASSWORD: turnos
          POSTGRES_DB: turnos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turnos -d turnos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Valores dummy: no hay secretos reales en CI. La base la provee el service.
      DATABASE_URL: postgresql://turnos:turnos@localhost:5432/turnos
      APP_BASE_URL: http://localhost:3000
      TZ_CONSULTORIO: America/Argentina/Buenos_Aires
      SESSION_SECRET: ci-only-placeholder-no-usar-en-produccion

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
